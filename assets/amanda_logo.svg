<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="amandaBg" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#5a1820" />
      <stop offset="60%" stop-color="#3b0f14" />
      <stop offset="100%" stop-color="#24070a" />
    </radialGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="30%" stop-color="#E2B144" />
      <stop offset="70%" stop-color="#C58F28" />
      <stop offset="100%" stop-color="#F5D77F" />
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="50%" stop-color="#E5BA4D" />
      <stop offset="100%" stop-color="#A87315" />
    </linearGradient>

    <!-- Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ring Background -->
  <circle cx="120" cy="120" r="114" fill="url(#amandaBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="120" cy="120" r="106" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8" />
  <circle cx="120" cy="120" r="101" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />

  <!-- Crown Ornament -->
  <g transform="translate(120, 52) scale(0.85)" filter="url(#glow)">
    <!-- Crown Base -->
    <path d="M-32,15 L32,15 L28,21 L-28,21 Z" fill="url(#goldGrad)" />
    <!-- Crown Peaks -->
    <path d="M-32,15 L-36,-4 L-18,6 L0,-16 L18,6 L36,-4 L32,15 Z" fill="url(#goldLight)" />
    <!-- Jewels on Crown -->
    <circle cx="0" cy="-16" r="3.5" fill="#FFF3C4" stroke="#8C5E14" stroke-width="0.8" />
    <circle cx="-36" cy="-4" r="2.8" fill="#FFF3C4" stroke="#8C5E14" stroke-width="0.8" />
    <circle cx="36" cy="-4" r="2.8" fill="#FFF3C4" stroke="#8C5E14" stroke-width="0.8" />
    <circle cx="-18" cy="6" r="2.2" fill="#FFF3C4" />
    <circle cx="18" cy="6" r="2.2" fill="#FFF3C4" />
    <!-- Center Emblem Star on Crown -->
    <path d="M0,1 L2,7 L8,9 L2,11 L0,17 L-2,11 L-8,9 L-2,7 Z" fill="#4A121A" opacity="0.9" />
  </g>

  <!-- Decorative Laurel Leaves (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.85">
    <!-- Left Leaves -->
    <path d="M48,82 C42,75 36,82 34,88 C40,88 46,86 48,82 Z" />
    <path d="M42,96 C36,90 30,98 28,105 C34,104 40,101 42,96 Z" />
    <path d="M40,114 C34,110 30,119 29,126 C35,124 40,120 40,114 Z" />
    <!-- Right Leaves -->
    <path d="M192,82 C198,75 204,82 206,88 C200,88 194,86 192,82 Z" />
    <path d="M198,96 C204,90 210,98 212,105 C206,104 200,101 198,96 Z" />
    <path d="M200,114 C206,110 210,119 211,126 C205,124 200,120 200,114 Z" />
  </g>

  <!-- Central Typography: AMANDA -->
  <!-- Subtle Shadow / Depth -->
  <text x="120" y="118" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="#1a0407" 
        opacity="0.6">AMANDA</text>
  
  <text x="120" y="116" 
        font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
        font-size="36" 
        font-weight="900" 
        letter-spacing="3" 
        text-anchor="middle" 
        fill="url(#goldLight)">AMANDA</text>

  <!-- Divider Ribbon / Scroll -->
  <g transform="translate(120, 138)">
    <!-- Brownies Cake Slice Icon -->
    <rect x="-14" y="-12" width="28" height="12" rx="2" fill="#2A080C" stroke="url(#goldGrad)" stroke-width="1.2" />
    <line x1="-14" y1="-6" x2="14" y2="-6" stroke="url(#goldLight)" stroke-width="1.2" />
    <path d="M-6,-12 Q0,-15 6,-12" fill="none" stroke="url(#goldLight)" stroke-width="1" />

    <!-- Ribbon Swirls Left & Right -->
    <path d="M-22,-6 C-40,-12 -65,-2 -78,-4 C-68,4 -45,-2 -22,-6 Z" fill="url(#goldGrad)" />
    <path d="M22,-6 C40,-12 65,-2 78,-4 C68,4 45,-2 22,-6 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Bottom Subtitle: BROWNIES KUKUS -->
  <!-- Curved Banner Pill -->
  <rect x="36" y="152" width="168" height="26" rx="13" fill="url(#goldGrad)" />
  <rect x="38" y="154" width="164" height="22" rx="11" fill="#3B0F14" />
  
  <text x="120" y="169.5" 
        font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
        font-size="12.5" 
        font-weight="800" 
        letter-spacing="2.2" 
        text-anchor="middle" 
        fill="url(#goldLight)">BROWNIES KUKUS</text>

  <!-- Since 1999 Established Badge -->
  <text x="120" y="196" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="9" 
        font-weight="700" 
        letter-spacing="1.8" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        opacity="0.85">ORIGINAL SINCE 1999</text>
  
  <circle cx="68" cy="193" r="1.5" fill="url(#goldGrad)" opacity="0.7" />
  <circle cx="172" cy="193" r="1.5" fill="url(#goldGrad)" opacity="0.7" />
</svg>
